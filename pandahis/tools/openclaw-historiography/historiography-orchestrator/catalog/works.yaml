# 著作编排清单（hist orchestrator SSOT）
# order: 全局队列顺序（同时仅一本 running）

queue_order:
  - 01A尚书
  # - 01史记

works:
  01A尚书:
    title: 尚书
    split_dir: 二十四史拆分后/01A尚书_拆分后
    paragraph_mode: line
    volume_type_default: 纪传叙事
    gold_volumes: ["001"]
    openclaw_agent: hist-worker
    # llm_step_seconds_hard_floor: Step1/3 <5s 硬失败（防秒回）
    # step*_seconds_*: 0 = 关闭建议用时告警；主门控为 verify
    llm_step_seconds_hard_floor: 5
    step1_seconds_advisory: false
    step1_seconds_floor: 0
    step1_seconds_per_para: 0
    step1_seconds_cap: 0
    step3_seconds_advisory: false
    step3_seconds_floor: 0
    step3_seconds_per_para: 0
    step3_seconds_cap: 0
    evidence_spot_check_paragraphs: 8
    max_retries_per_step: 2

  01史记:
    title: 史记
    split_dir: 二十四史拆分后/01史记_拆分后
    paragraph_mode: line
    volume_type_default: 纪传叙事
    gold_volumes: ["001"]
    openclaw_agent: hist-worker
    llm_step_seconds_hard_floor: 5
    step1_seconds_advisory: false
    step1_seconds_floor: 0
    step1_seconds_per_para: 0
    step1_seconds_cap: 0
    step3_seconds_advisory: false
    step3_seconds_floor: 0
    step3_seconds_per_para: 0
    step3_seconds_cap: 0
    evidence_spot_check_paragraphs: 8
    max_retries_per_step: 2
